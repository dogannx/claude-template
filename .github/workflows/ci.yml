name: CI

# Enforces what docs/conventions.md and coding-standards.md only describe.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  os-health:
    name: AI Project OS health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: System decay check (warnings)
        run: bash scripts/check-system.sh

  commit-lint:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Validate commit messages
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          fail=0
          while read -r sha; do
            msg=$(git log -1 --format=%s "$sha")
            case "$msg" in Merge*|Revert*) continue ;; esac
            echo "$msg" | grep -Eq '^(feat|fix|refactor|docs|test|chore|perf|build|ci)(\([a-z0-9_-]+\))?!?: .+' \
              || { echo "✗ Bad commit: $msg"; fail=1; }
          done < <(git rev-list "$base".."$head")
          exit $fail

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Enables the migration round-trip test (cmd/migrate) against a real PostgreSQL.
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - run: gofmt -l . | tee /dev/stderr | (! grep -q .)   # fail if unformatted
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  frontend:
    name: Frontend (yarn)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable   # yarn version comes from package.json "packageManager"
      - uses: actions/setup-node@v5
        with: { node-version: 'lts/*', cache: yarn, cache-dependency-path: frontend/yarn.lock }
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn build
      - run: yarn test
