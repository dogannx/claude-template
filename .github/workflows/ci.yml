name: CI

# Enforces what docs/conventions.md and coding-standards.md only describe.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  os-health:
    name: AI Project OS health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System decay check (warnings)
        run: bash scripts/check-system.sh

  commit-lint:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Validate commit messages
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          fail=0
          while read -r sha; do
            msg=$(git log -1 --format=%s "$sha")
            case "$msg" in Merge*|Revert*) continue ;; esac
            echo "$msg" | grep -Eq '^(feat|fix|refactor|docs|test|chore|perf|build|ci)(\([a-z0-9_-]+\))?!?: .+' \
              || { echo "✗ Bad commit: $msg"; fail=1; }
          done < <(git rev-list "$base".."$head")
          exit $fail

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable', cache-dependency-path: backend/go.sum }
      - run: test -f go.mod || { echo "backend not initialized — skipping"; exit 0; }
      - run: gofmt -l . | tee /dev/stderr | (! grep -q .)   # fail if unformatted
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  frontend:
    name: Frontend (yarn)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/*', cache: yarn, cache-dependency-path: frontend/yarn.lock }
      - run: test -f package.json || { echo "frontend not initialized — skipping"; exit 0; }
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build
      - run: yarn test
